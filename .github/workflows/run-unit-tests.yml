name: Run Unit Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - run: pnpm install --frozen-lockfile

      - run: pnpm approve-builds

      - run: pnpm test
